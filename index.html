<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sofia+Sans:wght@300;400;600;700;800;900&display=swap"
    rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="assets/gifs&pics/forget-me-not.svg">

  <title>To my Vonnie... | 11.14.26</title>
  <link rel="stylesheet" href="assets/styles/style.css" />
</head>

<body>
  <main class="split">

    <!-- LEFT SIDE: painting + text -->
    <section class="left">
      <img class="painting" src="assets/gifs&pics/fmn-painting.png" alt="A forget-me-not painting">

      <div class="leftText">
        <h1 class="floatIn titleAnimation">Happy monthsary!</h1>
        <p class="sub floatIn subAnimation">14th of the month na naman po</p>
      </div>

      <a href="https://zoeartgarden.us/products/forget-me-not-flower-wall-art-gouache-art-print-blue-flower-art"
        class="referenceLink" target="_blank" rel="noopener noreferrer">Artwork reference</a>
    </section>

    <!-- RIGHT SIDE: code question -->
    <section class="right">
      <!-- floating forget-me-not decorations -->
      <img class="flower f1" src="assets/gifs&pics/forget-me-not.svg" alt="">
      <img class="flower f2" src="assets/gifs&pics/forget-me-not.svg" alt="">
      <img class="flower f3" src="assets/gifs&pics/forget-me-not.svg" alt="">
      <img class="flower f4" src="assets/gifs&pics/forget-me-not.svg" alt="">
      <img class="flower f5" src="assets/gifs&pics/forget-me-not.svg" alt="">
      <img class="flower f6" src="assets/gifs&pics/forget-me-not.svg" alt="">
      <img class="flower f7" src="assets/gifs&pics/forget-me-not.svg" alt="">
      <img class="flower f8" src="assets/gifs&pics/forget-me-not.svg" alt="">

      <form id="lockForm" class="lock" novalidate>
        <label class="question" for="answerInput">Kinsa imong uyab?</label>

        <input type="text" id="answerInput" class="answerInput" placeholder="Enter here..." autocomplete="off"
          spellcheck="false" />

        <p class="hint">me na to</p>

        <button type="submit" class="enterBtn">OPEN</button>
      </form>
    </section>
  </main>
  <script src="assets/scripts/app.js"></script>
  <script src="assets/scripts/sound-effects.js"></script>
</body>

</html>
